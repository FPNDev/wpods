<!doctype html>
<meta charset="utf-8" />
<title>WPods app icon render</title>
<!-- Rasterises WPods.appIcon(size) at each native size the way the design previews it (SVG drawn onto a
     transparent canvas), then writes one "size base64png" line per rendition into #out for --dump-dom.
     ?src=<url> picks the generator script (default appicon.js next to this page). -->
<pre id="out"></pre>
<script>
  var SIZES = [16, 20, 24, 32, 40, 48, 64, 96, 256];
  var src = new URLSearchParams(location.search).get('src') || 'appicon.js';
  var script = document.createElement('script');
  script.src = src;
  script.onload = function () {
    var lines = [],
      pending = SIZES.length;
    SIZES.forEach(function (size, i) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        canvas.getContext('2d').drawImage(img, 0, 0, size, size);
        lines[i] = size + ' ' + canvas.toDataURL('image/png').split(',')[1];
        pending--;
        if (pending === 0) {
          document.getElementById('out').textContent = lines.join('\n');
        }
      };
      img.src =
        'data:image/svg+xml;charset=utf-8,' +
        encodeURIComponent(window.WPods.appIcon(size));
    });
  };
  document.head.appendChild(script);
</script>
