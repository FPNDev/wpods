# Pushing a v* tag builds dist\WPods-Setup.exe on the self-hosted runner and attaches it to a draft release.
# The tag must match $Version in build.ps1 (v0.3.0 for '0.3.0'). The release body is left empty to be written
# on GitHub before publishing.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches build.ps1
        shell: pwsh
        run: |
          $version = (Select-String -Path build.ps1 -Pattern "^\`$Version = '([^']+)'").Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match build.ps1 version $version (expected v$version)"
          }

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/WPods-Setup.exe --draft --title $env:GITHUB_REF_NAME --notes ''
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed ($LASTEXITCODE)"
          }
