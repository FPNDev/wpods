name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches build.ps1
        shell: pwsh
        run: |
          $version = (Select-String -Path build.ps1 -Pattern "^\`$Version = '([^']+)'").Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match build.ps1 version $version (expected v$version)"
          }

      - name: Build (x64)
        shell: pwsh
        run: ./build.ps1

      # Cross-compiled on an x64 runner too (needs the MSVC ARM64 build tools, Visual Studio component
      # Microsoft.VisualStudio.Component.VC.Tools.ARM64).
      - name: Build (arm64)
        shell: pwsh
        run: ./build.ps1 -Arch arm64

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/WPods-Setup.exe dist/WPods-Setup-arm64.exe --draft --title $env:GITHUB_REF_NAME --notes ''
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed ($LASTEXITCODE)"
          }
