<!doctype html>
<html lang="en-US" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width">
<title>WPods</title>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/bundle.js" defer></script>
<script src="shared.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="wp-window" data-ref="win">
  <div class="wp-titlebar" data-ref="titlebar">
    <button type="button" class="wp-iconbtn wp-back" data-ref="back" data-l-aria="common.back" hidden><span data-icon="chevron-left"></span></button>
    <span class="wp-titlebar__title" data-ref="pageTitle" hidden></span>
    <div class="wp-titlebar__app" data-ref="appTitle"><span data-glyph="pair"></span><span class="t-caption-strong" data-l="app.name"></span></div>
    <div class="wp-titlebar__caps">
      <button type="button" class="wp-iconbtn" data-ref="minimize" data-l-aria="window.minimize"><span data-icon="minimize"></span></button>
      <button type="button" class="wp-iconbtn wp-iconbtn--close" data-ref="close" data-l-aria="window.close"><span data-icon="close"></span></button>
    </div>
  </div>

  <div class="wp-body" data-ref="body">

    <div class="wp-page" data-page="firstRun">
      <div class="wp-empty">
        <h1 class="wp-empty__title wp-empty__title--display" data-l="firstRun.title"></h1>
        <p class="wp-empty__body" data-l="firstRun.body"></p>
        <ul class="wp-steps">
          <li><span class="wp-steps__icon"><span data-icon="pc"></span></span><span><span class="wp-steps__title" data-l="firstRun.trayTitle"></span><span class="wp-steps__desc" data-l="firstRun.trayDesc"></span></span></li>
          <li><span class="wp-steps__icon"><span data-icon="mic"></span></span><span><span class="wp-steps__title" data-l="firstRun.micTitle"></span><span class="wp-steps__desc" data-l="firstRun.micDesc"></span></span></li>
          <li><span class="wp-steps__icon"><span data-icon="power"></span></span><span class="wp-steps__row"><span class="wp-steps__grow"><span class="wp-steps__title" id="frStartupTitle" data-l="windows.startup"></span><span class="wp-steps__desc" data-l="firstRun.startupDesc"></span></span>
            <label class="wp-switch"><input class="wp-switch__input" type="checkbox" role="switch" aria-labelledby="frStartupTitle" data-ref="frStartup"><span class="wp-switch__track"><span class="wp-switch__thumb"></span></span></label></span></li>
        </ul>
        <div class="wp-empty__actions"><button type="button" class="wp-btn wp-btn--primary wp-btn--lg wp-btn--block" data-ref="getStarted" data-l="firstRun.getStarted"></button></div>
      </div>
    </div>

    <div class="wp-page" data-page="empty">
      <div class="wp-empty">
        <span data-art="empty" data-class="wp-empty__art"></span>
        <h1 class="wp-empty__title" data-l="empty.title"></h1>
        <p class="wp-empty__body" data-l="empty.body"></p>
        <div class="wp-empty__actions">
          <button type="button" class="wp-btn wp-btn--primary wp-btn--lg wp-btn--block" data-ref="openBluetooth"><span data-icon="bluetooth"></span><span data-l="empty.openBluetooth"></span></button>
        </div>
        <ol class="wp-steps">
          <li><span class="wp-steps__icon t-body-strong">1</span><span><span class="wp-steps__title" data-l="pair.step1Title"></span><span class="wp-steps__desc" data-l="pair.step1Desc"></span></span></li>
          <li><span class="wp-steps__icon t-body-strong">2</span><span><span class="wp-steps__title" data-l="pair.step2Title"></span><span class="wp-steps__desc" data-l="pair.step2Desc"></span></span></li>
          <li><span class="wp-steps__icon t-body-strong">3</span><span><span class="wp-steps__title" data-l="pair.step3Title"></span><span class="wp-steps__desc" data-l="pair.step3Desc"></span></span></li>
        </ol>
      </div>
    </div>

    <div class="wp-page" data-page="pair">
      <div class="wp-empty">
        <ol class="wp-steps">
          <li><span class="wp-steps__icon t-body-strong">1</span><span><span class="wp-steps__title" data-l="pair.step1Title"></span><span class="wp-steps__desc" data-l="pair.step1Desc"></span></span></li>
          <li><span class="wp-steps__icon t-body-strong">2</span><span><span class="wp-steps__title" data-l="pair.step2Title"></span><span class="wp-steps__desc" data-l="pair.step2Desc"></span></span></li>
          <li><span class="wp-steps__icon t-body-strong">3</span><span><span class="wp-steps__title" data-l="pair.step3Title"></span><span class="wp-steps__desc" data-l="pair.step3Desc"></span></span></li>
        </ol>
        <div class="wp-empty__actions">
          <button type="button" class="wp-btn wp-btn--primary wp-btn--lg wp-btn--block" data-ref="addDevice"><span data-icon="bluetooth"></span><span data-l="pair.addDevice"></span></button>
        </div>
      </div>
    </div>

    <div class="wp-page" data-page="home">
      <section class="wp-card wp-hero" data-ref="hero" data-l-aria="home.yourAirPods">
        <span data-art="pro" data-class="wp-hero__art"></span>
        <div class="wp-hero__id">
          <div class="wp-hero__switch">
            <button type="button" class="wp-devswitch" aria-haspopup="menu" aria-expanded="false" data-ref="devSwitch"><span class="wp-devswitch__name" data-ref="devSwitchName"></span><span data-icon="chevron-down"></span></button>
            <span class="wp-devswitch wp-devswitch--static" data-ref="devStatic"><span class="wp-devswitch__name" data-ref="devStaticName"></span></span>
            <div class="wp-menu" role="menu" data-l-aria="home.yourAirPods" data-ref="menu" hidden>
              <div class="wp-menu__label" data-l="home.yourAirPods"></div>
              <div class="wp-menu__sep" role="separator" data-ref="menuSep"></div>
              <button type="button" class="wp-menu__item wp-menu__item--compact" role="menuitem" tabindex="-1" data-ref="menuPair"><span data-icon="plus" data-class="wp-menu__glyph"></span><span class="wp-menu__title" data-l="menu.pairNew"></span><span data-icon="external" data-class="wp-menu__ext"></span></button>
            </div>
          </div>
          <span class="wp-status" role="status" data-ref="status"><span class="wp-status__dot" data-ref="statusDot"></span><span data-ref="statusText"></span></span>
        </div>
        <div class="wp-batteries" data-ref="heroBatteries"></div>
        <p class="wp-hero__hint" data-ref="heroHint" hidden></p>
        <p class="wp-hero__hint" data-ref="heroKeysHint" data-l="home.keysHint" hidden></p>
        <div class="wp-hero__actions" data-ref="heroActions"><button type="button" class="wp-btn wp-btn--primary" data-ref="heroAction"></button></div>
      </section>

      <section class="wp-group" data-ref="ncGroup">
        <h2 class="wp-group__title" data-l="nc.title"></h2>
        <div class="wp-list">
          <div class="wp-row wp-row--stack">
            <p class="wp-note" id="ncLocked" data-ref="ncLocked"><span data-icon="info"></span><span data-l="common.connectToChange"></span></p>
            <fieldset class="wp-seg wp-seg--icons" data-ref="ncSeg">
              <legend class="wp-sr" data-l="nc.title"></legend>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="nc" value="off" data-ref="nc_off"><span class="wp-seg__face"><span class="wp-seg__disc"><span data-icon="nc-off" data-class="wp-icon--lg"></span></span><span class="wp-seg__label" data-l="nc.off"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="nc" value="noiseCancellation" data-ref="nc_noiseCancellation"><span class="wp-seg__face"><span class="wp-seg__disc"><span data-icon="nc-anc" data-class="wp-icon--lg"></span></span><span class="wp-seg__label" data-l="nc.noiseCancellation"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="nc" value="transparency" data-ref="nc_transparency"><span class="wp-seg__face"><span class="wp-seg__disc"><span data-icon="nc-transparency" data-class="wp-icon--lg"></span></span><span class="wp-seg__label" data-l="nc.transparency"></span></span></label>
              <label class="wp-seg__item" data-ref="ncAdaptiveItem"><input class="wp-seg__input" type="radio" name="nc" value="adaptive" data-ref="nc_adaptive"><span class="wp-seg__face"><span class="wp-seg__disc"><span data-icon="nc-adaptive" data-class="wp-icon--lg"></span></span><span class="wp-seg__label" data-l="nc.adaptive"></span></span></label>
            </fieldset>
            <p class="wp-note" id="ncOneBud" data-ref="ncOneBud" hidden><span data-icon="info"></span><span data-l="nc.oneBudNote"></span></p>
          </div>
        </div>
      </section>

      <section class="wp-group">
        <h2 class="wp-group__title"><span data-l="mic.title"></span>
          <span class="wp-chip" role="status" data-ref="micChip"><span data-spinner data-class="wp-spinner--sm"></span><span data-icon="warning" data-class="wp-icon--sm"></span><span class="wp-chip__dot"></span><span data-ref="micLabel"></span></span>
        </h2>
        <div class="wp-list">
          <div class="wp-row"><div class="wp-row__text"><span class="wp-row__desc" data-ref="micDesc"></span></div></div>
          <div class="wp-row wp-row--stack">
            <div class="wp-row__head"><div class="wp-row__text"><span class="wp-row__title" data-l="mic.mode"></span></div></div>
            <fieldset class="wp-seg" data-ref="micModeSeg">
              <legend class="wp-sr" data-l="mic.mode"></legend>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="micMode" value="standard" data-ref="mm_standard"><span class="wp-seg__face"><span class="wp-seg__label" data-l="mic.standard"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="micMode" value="voiceIsolation" data-ref="mm_voiceIsolation"><span class="wp-seg__face"><span class="wp-seg__label" data-l="mic.voiceIsolation"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="micMode" value="wideSpectrum" data-ref="mm_wideSpectrum"><span class="wp-seg__face"><span class="wp-seg__label" data-l="mic.wideSpectrum"></span></span></label>
            </fieldset>
            <p class="wp-note"><span data-icon="info"></span><span data-l="mic.rnnoiseNote"></span></p>
          </div>
          <div class="wp-row wp-row--stack">
            <div class="wp-row__head"><div class="wp-row__text"><span class="wp-row__title" data-l="mic.side"></span><span class="wp-row__desc" data-l="mic.sideDesc"></span></div>
              <span class="wp-row__end wp-row__checking" data-ref="micSideCheck" hidden><span data-spinner></span><span data-l="common.checking"></span></span></div>
            <fieldset class="wp-seg" data-ref="micSideSeg">
              <legend class="wp-sr" data-l="mic.side"></legend>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="micSide" value="automatic" data-ref="ms_automatic"><span class="wp-seg__face"><span class="wp-seg__label" data-l="mic.automatic"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="micSide" value="left" data-ref="ms_left"><span class="wp-seg__face"><span class="wp-seg__label" data-l="mic.left"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="micSide" value="right" data-ref="ms_right"><span class="wp-seg__face"><span class="wp-seg__label" data-l="mic.right"></span></span></label>
            </fieldset>
            <p class="wp-note" id="micSideLocked" data-ref="micSideLocked" hidden><span data-icon="info"></span><span data-l="common.connectToChange"></span></p>
          </div>
        </div>
      </section>

      <section class="wp-group">
        <h2 class="wp-group__title" data-l="features.title"></h2>
        <div class="wp-list" data-ref="features">
          <div class="wp-row" data-ref="featLocked"><p class="wp-note" id="featLocked"><span data-icon="info"></span><span data-l="common.connectToChange"></span></p></div>
        </div>
      </section>

      <section class="wp-group">
        <h2 class="wp-group__title" data-l="home.more"></h2>
        <div class="wp-list">
          <button type="button" class="wp-row wp-row--nav" data-ref="toControls"><span class="wp-row__lead"><span data-icon="press"></span></span><span class="wp-row__text"><span class="wp-row__title" data-l="controls.title"></span><span class="wp-row__desc" data-l="home.controlsDesc"></span></span><span class="wp-row__end"><span data-icon="chevron-right"></span></span></button>
          <button type="button" class="wp-row wp-row--nav" data-ref="toWindows"><span class="wp-row__lead"><span data-icon="pc"></span></span><span class="wp-row__text"><span class="wp-row__title" data-l="windows.title"></span><span class="wp-row__desc" data-l="home.windowsDesc"></span></span><span class="wp-row__end"><span data-icon="chevron-right"></span></span></button>
        </div>
      </section>
    </div>

    <div class="wp-page" data-page="controls">
      <section class="wp-group">
        <h2 class="wp-group__title" data-l="controls.pressTitle"></h2>
        <div class="wp-list">
          <div class="wp-row" data-ref="pressLocked"><p class="wp-note" id="pressLocked"><span data-icon="info"></span><span data-l="common.connectToChange"></span></p></div>
          <div class="wp-row wp-row--stack">
            <div class="wp-row__head"><span class="wp-row__lead"><span data-icon="double"></span></span><div class="wp-row__text"><span class="wp-row__title" data-l="controls.pressSpeed"></span><span class="wp-row__desc" data-l="controls.pressSpeedDesc"></span></div>
              <span class="wp-row__end wp-row__checking" data-ref="pressSpeedCheck" hidden><span data-spinner></span><span data-l="common.checking"></span></span></div>
            <fieldset class="wp-seg" data-ref="pressSpeedSeg"><legend class="wp-sr" data-l="controls.pressSpeed"></legend>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="pressSpeed" value="default" data-ref="ps_default"><span class="wp-seg__face"><span class="wp-seg__label" data-l="controls.default"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="pressSpeed" value="slower" data-ref="ps_slower"><span class="wp-seg__face"><span class="wp-seg__label" data-l="controls.slower"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="pressSpeed" value="slowest" data-ref="ps_slowest"><span class="wp-seg__face"><span class="wp-seg__label" data-l="controls.slowest"></span></span></label>
            </fieldset>
          </div>
          <div class="wp-row wp-row--stack">
            <div class="wp-row__head"><span class="wp-row__lead"><span data-icon="hold"></span></span><div class="wp-row__text"><span class="wp-row__title" data-l="controls.holdDuration"></span><span class="wp-row__desc" data-l="controls.holdDurationDesc"></span></div>
              <span class="wp-row__end wp-row__checking" data-ref="holdCheck" hidden><span data-spinner></span><span data-l="common.checking"></span></span></div>
            <fieldset class="wp-seg" data-ref="holdSeg"><legend class="wp-sr" data-l="controls.holdDuration"></legend>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="holdDuration" value="default" data-ref="hd_default"><span class="wp-seg__face"><span class="wp-seg__label" data-l="controls.default"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="holdDuration" value="shorter" data-ref="hd_shorter"><span class="wp-seg__face"><span class="wp-seg__label" data-l="controls.shorter"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="holdDuration" value="shortest" data-ref="hd_shortest"><span class="wp-seg__face"><span class="wp-seg__label" data-l="controls.shortest"></span></span></label>
            </fieldset>
          </div>
        </div>
      </section>
      <section class="wp-group">
        <h2 class="wp-group__title" data-l="controls.soundsTitle"></h2>
        <div class="wp-list">
          <div class="wp-row" data-ref="toneLocked"><p class="wp-note" id="toneLocked"><span data-icon="info"></span><span data-l="common.connectToChange"></span></p></div>
          <div class="wp-row wp-row--stack">
            <div class="wp-row__head"><div class="wp-row__text"><span class="wp-row__title" data-l="controls.tone"></span><span class="wp-row__desc" data-l="controls.toneDesc"></span></div>
              <span class="wp-row__end wp-row__checking" data-ref="toneCheck" hidden><span data-spinner></span><span data-l="common.checking"></span></span></div>
            <div class="wp-slider" data-ref="toneSlider"><span data-icon="tone" data-class="wp-slider__icon"></span><input class="wp-slider__input" type="range" min="0" max="100" data-l-aria="controls.tone" data-ref="tone"><span class="wp-slider__value" data-ref="toneValue"></span></div>
          </div>
        </div>
      </section>
    </div>

    <div class="wp-page" data-page="windows">
      <section class="wp-group">
        <h2 class="wp-group__title" data-ref="windowsFor"></h2>
        <div class="wp-list">
          <div class="wp-row"><div class="wp-row__text"><span class="wp-row__title" id="hfpTitle" data-l="windows.handsFree"></span><span class="wp-row__desc" data-l="windows.handsFreeDesc"></span></div>
            <label class="wp-switch"><input class="wp-switch__input" type="checkbox" role="switch" aria-labelledby="hfpTitle" data-ref="handsFree"><span class="wp-switch__track"><span class="wp-switch__thumb"></span></span></label></div>
          <div class="wp-row wp-row--stack">
            <div class="wp-row__head"><div class="wp-row__text"><span class="wp-row__title" id="latencyTitle" data-l="windows.latency"></span><span class="wp-row__desc" data-l="windows.latencyDesc"></span></div>
              <label class="wp-switch"><input class="wp-switch__input" type="checkbox" role="switch" aria-labelledby="latencyTitle" data-ref="latency"><span class="wp-switch__track"><span class="wp-switch__thumb"></span></span></label></div>
            <p class="wp-note wp-note--warning" data-ref="latencyNote" hidden><span data-icon="warning"></span><span data-l="windows.latencyNote"></span></p>
          </div>
        </div>
      </section>
      <section class="wp-group">
        <h2 class="wp-group__title" data-l="app.name"></h2>
        <div class="wp-list">
          <div class="wp-row"><div class="wp-row__text"><span class="wp-row__title" id="startupTitle" data-l="windows.startup"></span><span class="wp-row__desc" data-l="windows.startupDesc"></span></div>
            <label class="wp-switch"><input class="wp-switch__input" type="checkbox" role="switch" aria-labelledby="startupTitle" data-ref="startup"><span class="wp-switch__track"><span class="wp-switch__thumb"></span></span></label></div>
          <div class="wp-row wp-row--stack">
            <div class="wp-row__head"><div class="wp-row__text"><span class="wp-row__title" data-l="windows.theme"></span><span class="wp-row__desc" data-l="windows.themeDesc"></span></div></div>
            <fieldset class="wp-seg" data-ref="themeSeg"><legend class="wp-sr" data-l="windows.theme"></legend>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="theme" value="light" data-ref="th_light"><span class="wp-seg__face"><span class="wp-seg__label" data-l="windows.themeLight"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="theme" value="dark" data-ref="th_dark"><span class="wp-seg__face"><span class="wp-seg__label" data-l="windows.themeDark"></span></span></label>
              <label class="wp-seg__item"><input class="wp-seg__input" type="radio" name="theme" value="auto" data-ref="th_auto"><span class="wp-seg__face"><span class="wp-seg__label" data-l="windows.themeAuto"></span></span></label>
            </fieldset>
          </div>
          <button type="button" class="wp-row wp-row--nav" data-ref="toLanguage"><span class="wp-row__text"><span class="wp-row__title" data-l="lang.title"></span></span><span class="wp-row__end"><span class="wp-row__value" data-ref="langValue"></span><span data-icon="chevron-right"></span></span></button>
          <div class="wp-row"><div class="wp-row__text"><span class="wp-row__title" id="accentTitle" data-l="windows.accent"></span><span class="wp-row__desc" data-l="windows.accentDesc"></span></div>
            <label class="wp-switch"><input class="wp-switch__input" type="checkbox" role="switch" aria-labelledby="accentTitle" data-ref="accent"><span class="wp-switch__track"><span class="wp-switch__thumb"></span></span></label></div>
        </div>
      </section>
    </div>

    <div class="wp-page" data-page="language">
      <div class="wp-search">
        <span data-icon="search" data-class="wp-search__icon"></span>
        <input class="wp-search__input" type="search" data-l-aria="lang.search" data-l-ph="lang.search" data-ref="langSearch">
      </div>
      <section class="wp-group">
        <div class="wp-list" role="radiogroup" data-l-aria="lang.title">
          <button type="button" class="wp-row wp-choice" role="radio" aria-checked="false" data-ref="langAuto">
            <span class="wp-row__lead"><span data-icon="globe"></span></span>
            <span class="wp-row__text"><span class="wp-row__title" data-l="lang.sameAsWindows"></span><span class="wp-row__desc" data-ref="langWindows"></span></span>
            <span data-icon="check" data-class="wp-row__check"></span>
          </button>
        </div>
      </section>
      <section class="wp-group">
        <h2 class="wp-group__title" data-l="lang.all"></h2>
        <div class="wp-list" role="radiogroup" data-l-aria="lang.all" data-ref="langList">
          <p class="wp-empty-note" data-ref="langNone" hidden></p>
        </div>
        <p class="wp-group__foot" data-l="lang.foot"></p>
      </section>
    </div>
  </div>

  <div class="wp-toast" data-ref="toast" hidden>
    <span data-icon="info" data-class="wp-toast__icon wp-icon--lg wp-toast__icon--info"></span>
    <span data-icon="check-circle" data-class="wp-toast__icon wp-icon--lg wp-toast__icon--success"></span>
    <span data-icon="error" data-class="wp-toast__icon wp-icon--lg wp-toast__icon--error"></span>
    <span class="wp-toast__msg" data-ref="toastMsg"></span>
    <button type="button" class="wp-btn wp-btn--subtle" data-ref="toastAction"></button>
    <button type="button" class="wp-iconbtn" data-l-aria="common.dismiss" data-ref="toastClose"><span data-icon="close"></span></button>
  </div>
  <div class="wp-sr" role="status" data-ref="announce"></div>
</div>
</body>
</html>
